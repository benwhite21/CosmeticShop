<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký - CosmeticShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-color: #e85a71; --primary-hover: #d4435b; }
        body { background-color: #f8f9fa; }
        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .nav-pills .nav-link.active {
            background-color: var(--primary-color);
        }
        .nav-pills .nav-link {
            color: #555;
            font-weight: 600;
        }
        .btn-primary-custom {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
        }
        .btn-primary-custom:hover {
            background-color: var(--primary-hover);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card auth-card p-4 bg-white">
        <div class="text-center mb-4">
            <a th:href="@{/}" class="text-decoration-none fs-3 fw-bold text-danger">
                <i class="fa-solid fa-spa me-2"></i>CosmeticShop
            </a>
            <p class="text-muted small mt-1">Đăng nhập hoặc tạo tài khoản mới</p>
        </div>

        <ul class="nav nav-pills nav-fill mb-4" id="authTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button">Đăng nhập</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button">Đăng ký</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">
            <!-- Form Đăng nhập -->
            <div class="tab-pane fade show active" id="loginPane">
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email</label>
                        <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Mật khẩu</label>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                    </div>
                    <div id="loginAlert" class="alert alert-danger d-none py-2 small"></div>
                    <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-2">Đăng nhập</button>
                </form>
            </div>

            <!-- Form Đăng ký -->
            <div class="tab-pane fade" id="registerPane">
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Họ và tên</label>
                        <input type="text" class="form-control" id="regFullName" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Email</label>
                        <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Số điện thoại</label>
                        <input type="tel" class="form-control" id="regPhone" placeholder="0987654321">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Mật khẩu</label>
                        <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
                    </div>
                    <div id="regAlert" class="alert alert-danger d-none py-2 small"></div>
                    <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-2">Tạo tài khoản</button>
                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/}" class="text-muted small text-decoration-none">
                <i class="fa-solid fa-arrow-left me-1"></i> Quay về trang chủ
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Xử lý đăng nhập
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('loginAlert');
        alertBox.classList.add('d-none');

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data));
                window.location.href = '/';
            } else {
                const errorMsg = await res.text();
                alertBox.innerText = errorMsg || 'Đăng nhập thất bại!';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.innerText = 'Lỗi kết nối máy chủ!';
            alertBox.classList.remove('d-none');
        }
    });

    // Xử lý đăng ký
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const alertBox = document.getElementById('regAlert');
        alertBox.classList.add('d-none');

        const payload = {
            fullName: document.getElementById('regFullName').value,
            email: document.getElementById('regEmail').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPassword').value
        };

        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert('Đăng ký thành công! Hãy đăng nhập.');
                document.getElementById('login-tab').click();
                document.getElementById('loginEmail').value = payload.email;
            } else {
                const msg = await res.text();
                alertBox.innerText = msg || 'Đăng ký thất bại!';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.innerText = 'Lỗi kết nối máy chủ!';
            alertBox.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
