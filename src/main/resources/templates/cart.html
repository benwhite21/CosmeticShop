<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng & Thanh toán - CosmeticShop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-color: #e85a71; --primary-hover: #d4435b; }
        .navbar-brand { font-weight: 700; color: var(--primary-color) !important; }
        .btn-primary-custom { background-color: var(--primary-color); color: #fff; border: none; }
        .btn-primary-custom:hover { background-color: var(--primary-hover); color: #fff; }
        .product-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fa-solid fa-spa me-2"></i>CosmeticShop
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Tiếp tục mua sắm
        </a>
    </div>
</nav>

<div class="container my-5">
    <h4 class="fw-bold mb-4"><i class="fa-solid fa-bag-shopping text-danger me-2"></i>Giỏ hàng của bạn</h4>

    <div class="row g-4">
        <!-- Cột trái: Danh sách sản phẩm trong giỏ hàng -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4 p-3 mb-3">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Sản phẩm</th>
                            <th class="text-center">Số lượng</th>
                            <th class="text-end">Đơn giá</th>
                            <th class="text-end">Thành tiền</th>
                            <th class="text-center">Xóa</th>
                        </tr>
                        </thead>
                        <tbody id="cartTableBody">
                        <!-- JS render danh sách món hàng -->
                        </tbody>
                    </table>
                </div>
                <div id="emptyCart" class="text-center py-5 d-none">
                    <i class="fa-solid fa-cart-shopping fs-1 text-muted mb-3"></i>
                    <p class="text-muted">Giỏ hàng của bạn đang trống!</p>
                    <a th:href="@{/}" class="btn btn-primary-custom rounded-pill btn-sm px-4">Mua sắm ngay</a>
                </div>
            </div>
        </div>

        <!-- Cột phải: Thông tin nhận hàng & Thanh toán -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h5 class="fw-bold mb-3">Thông tin giao hàng</h5>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Địa chỉ nhận hàng (*)</label>
                    <textarea class="form-control" id="orderAddress" rows="2" placeholder="Số nhà, đường, phường/xã, quận/huyện..." required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Ghi chú đơn hàng</label>
                    <input type="text" class="form-control" id="orderNote" placeholder="Ví dụ: Giao giờ hành chính">
                </div>

                <!-- Áp dụng Coupon -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Mã giảm giá (Coupon)</label>
                    <div class="input-group">
                        <input type="text" class="form-control text-uppercase" id="couponCode" placeholder="Nhập mã coupon...">
                        <button class="btn btn-outline-danger" type="button" onclick="applyCoupon()">Áp dụng</button>
                    </div>
                    <small id="couponMessage" class="d-block mt-1"></small>
                </div>

                <!-- Phương thức thanh toán -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Phương thức thanh toán</label>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="payCOD" value="COD" checked>
                        <label class="form-check-label small" for="payCOD">
                            <i class="fa-solid fa-truck text-secondary me-1"></i> Thanh toán khi nhận hàng (COD)
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="paymentMethod" id="payVNPAY" value="BANKING">
                        <label class="form-check-label small" for="payVNPAY">
                            <i class="fa-regular fa-credit-card text-primary me-1"></i> Cổng thanh toán VNPAY (ATM/QR)
                        </label>
                    </div>
                </div>

                <hr>

                <!-- Tổng kết chi phí -->
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Tạm tính:</span>
                    <span class="fw-semibold" id="subtotalText">0 đ</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Giảm giá:</span>
                    <span class="text-danger fw-semibold" id="discountText">-0 đ</span>
                </div>
                <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                    <span>Tổng cộng:</span>
                    <span class="text-danger" id="totalPriceText">0 đ</span>
                </div>

                <button class="btn btn-primary-custom w-100 rounded-pill py-2 fw-semibold" id="checkoutBtn" onclick="checkout()">
                    <i class="fa-solid fa-shield-halved me-1"></i> Đặt hàng ngay
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentCart = null;
    let discountAmount = 0;
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    const user = userStr ? JSON.parse(userStr) : null;
    const userId = user ? (user.id || user.userId) : null;

    if (!token || !userId) {
        alert('Vui lòng đăng nhập để xem giỏ hàng!');
        window.location.href = '/login';
    }

    async function loadCart() {
        try {
            const res = await fetch('/api/cart?userId=' + userId, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                currentCart = await res.json();
                renderCart();
            } else if (res.status === 401) {
                localStorage.clear();
                window.location.href = '/login';
            }
        } catch (e) {
            console.error('Lỗi tải giỏ hàng:', e);
        }
    }

    function renderCart() {
        const tbody = document.getElementById('cartTableBody');
        tbody.innerHTML = '';

        if (!currentCart || !currentCart.items || currentCart.items.length === 0) {
            document.getElementById('emptyCart').classList.remove('d-none');
            document.getElementById('checkoutBtn').disabled = true;
            updateTotals(0);
            return;
        }

        document.getElementById('emptyCart').classList.add('d-none');
        document.getElementById('checkoutBtn').disabled = false;

        let subtotal = 0;
        currentCart.items.forEach(item => {
            const prod = item.product || {};
            const productId = prod.id || item.productId;
            const productName = prod.name || item.productName || 'Mỹ phẩm chính hãng';
            const price = Number(prod.price != null ? prod.price : (item.price || 0));
            const imageUrl = prod.imageUrl || item.imageUrl || 'https://placehold.co/65x65?text=SP';

            const itemTotal = price * item.quantity;
            subtotal += itemTotal;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div class="d-flex align-items-center">
                        <img src="${imageUrl}" class="product-thumb me-3" alt="Ảnh">
                        <div>
                            <h6 class="mb-0 fw-semibold text-truncate" style="max-width: 260px;">${productName}</h6>
                        </div>
                    </div>
                </td>
                <td class="text-center" style="width: 120px;">
                    <input type="number" class="form-control form-control-sm text-center" value="${item.quantity}" min="1" onchange="updateQty(${productId}, this.value)">
                </td>
                <td class="text-end fw-semibold text-muted">${price.toLocaleString('vi-VN')} đ</td>
                <td class="text-end fw-bold text-danger">${itemTotal.toLocaleString('vi-VN')} đ</td>
                <td class="text-center" style="width: 50px;">
                    <button class="btn btn-sm btn-link text-danger p-0" onclick="removeItem(${productId})">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        updateTotals(subtotal);
    }

    function updateTotals(subtotal) {
        document.getElementById('subtotalText').innerText = subtotal.toLocaleString('vi-VN') + ' đ';
        document.getElementById('discountText').innerText = '-' + discountAmount.toLocaleString('vi-VN') + ' đ';
        const finalTotal = Math.max(0, subtotal - discountAmount);
        document.getElementById('totalPriceText').innerText = finalTotal.toLocaleString('vi-VN') + ' đ';
    }

    async function updateQty(productId, quantity) {
        const qty = parseInt(quantity);
        if (qty <= 0) {
            removeItem(productId);
            return;
        }
        await fetch(`/api/cart/update?userId=${userId}&productId=${productId}&quantity=${qty}`, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        loadCart();
    }

    async function removeItem(productId) {
        if (!confirm('Bạn có muốn xóa sản phẩm này khỏi giỏ?')) return;
        await fetch(`/api/cart/update?userId=${userId}&productId=${productId}&quantity=0`, {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        loadCart();
    }

    async function applyCoupon() {
        const code = document.getElementById('couponCode').value.trim();
        const msg = document.getElementById('couponMessage');
        if (!code) return;

        try {
            const res = await fetch(`/api/coupons/apply?code=${encodeURIComponent(code)}`, {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                const coupon = await res.json();
                discountAmount = coupon.discountValue || 0;
                msg.className = 'd-block mt-1 text-success small';
                msg.innerText = `Áp dụng mã ${code} thành công! Giảm ${discountAmount.toLocaleString('vi-VN')} đ`;
                loadCart();
            } else {
                const txt = await res.text();
                msg.className = 'd-block mt-1 text-danger small';
                msg.innerText = txt || 'Mã giảm giá không hợp lệ!';
            }
        } catch (e) {
            msg.className = 'd-block mt-1 text-danger small';
            msg.innerText = 'Lỗi kết nối!';
        }
    }

    async function checkout() {
        const address = document.getElementById('orderAddress').value.trim();
        const note = document.getElementById('orderNote').value.trim();
        const couponCode = document.getElementById('couponCode').value.trim();
        const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;

        if (!address) {
            alert('Vui lòng nhập địa chỉ nhận hàng!');
            document.getElementById('orderAddress').focus();
            return;
        }

        // Payload khớp với class OrderRequest của backend
        const payload = {
            shippingAddress: address,
            note: note || null,
            couponCode: couponCode || null,
            paymentMethod: paymentMethod
        };

        const btn = document.getElementById('checkoutBtn');
        btn.disabled = true;
        btn.innerText = 'Đang xử lý đơn hàng...';

        try {
            // Thêm ?userId=... vào URL endpoint
            const res = await fetch(`/api/orders/checkout?userId=${userId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const order = await res.json();
                if (paymentMethod === 'BANKING') {
                    const payRes = await fetch(`/api/payment/create-vnpay/${order.id}`, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const payData = await payRes.json();
                    if (payData && payData.paymentUrl) {
                        window.location.href = payData.paymentUrl;
                        return;
                    }
                }
                window.location.href = '/payment/success?orderId=' + order.id;
            } else {
                const err = await res.text();
                alert('Lỗi: ' + (err || 'Đặt hàng không thành công!'));
                btn.disabled = false;
                btn.innerText = 'Đặt hàng ngay';
            }
        } catch (e) {
            alert('Lỗi máy chủ khi đặt hàng!');
            btn.disabled = false;
            btn.innerText = 'Đặt hàng ngay';
        }
    }

    window.onload = loadCart;
</script>
</body>
</html>
