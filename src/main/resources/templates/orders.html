<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn mua của tôi - CosmeticShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-color: #e85a71; --primary-hover: #d4435b; }
        .navbar-brand { font-weight: 700; color: var(--primary-color) !important; }
        .btn-primary-custom { background-color: var(--primary-color); color: #fff; border: none; }
        .btn-primary-custom:hover { background-color: var(--primary-hover); color: #fff; }
        .status-badge { font-size: 0.82rem; padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .order-card { border-radius: 12px; border: 1px solid #eee; transition: all 0.2s; }
        .order-card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="fa-solid fa-spa me-2"></i>CosmeticShop
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-arrow-left me-1"></i> Về cửa hàng
        </a>
    </div>
</nav>

<div class="container my-5" style="max-width: 900px;">
    <h4 class="fw-bold mb-4"><i class="fa-solid fa-box-archive text-danger me-2"></i>Lịch sử đơn mua</h4>

    <div id="ordersContainer">
        <!-- JS render danh sách đơn hàng -->
    </div>

    <div id="emptyOrders" class="card border-0 shadow-sm rounded-4 p-5 text-center d-none">
        <i class="fa-regular fa-clipboard fs-1 text-muted mb-3"></i>
        <p class="text-muted mb-3">Bạn chưa có đơn mua nào.</p>
        <div>
            <a th:href="@{/}" class="btn btn-primary-custom rounded-pill btn-sm px-4">Khám phá sản phẩm ngay</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    const user = userStr ? JSON.parse(userStr) : null;
    const userId = user ? (user.id || user.userId) : null;

    if (!token || !userId) {
        alert('Vui lòng đăng nhập để xem đơn mua!');
        window.location.href = '/login';
    }

    const STATUS_MAP = {
        'PENDING': { text: 'Chờ xác nhận', class: 'bg-warning-subtle text-warning-emphasis' },
        'CONFIRMED': { text: 'Đã xác nhận', class: 'bg-info-subtle text-info-emphasis' },
        'SHIPPING': { text: 'Đang vận chuyển', class: 'bg-primary-subtle text-primary-emphasis' },
        'DELIVERED': { text: 'Giao thành công', class: 'bg-success-subtle text-success-emphasis' },
        'CANCELLED': { text: 'Đã hủy', class: 'bg-secondary-subtle text-secondary' }
    };

    async function loadOrders() {
        try {
            const res = await fetch(`/api/orders/user/${userId}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (res.ok) {
                const orders = await res.json();
                renderOrders(orders);
            } else if (res.status === 401) {
                localStorage.clear();
                window.location.href = '/login';
            }
        } catch (e) {
            console.error('Lỗi tải danh sách đơn:', e);
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('ordersContainer');
        const emptyBox = document.getElementById('emptyOrders');

        if (!orders || orders.length === 0) {
            emptyBox.classList.remove('d-none');
            return;
        }

        emptyBox.classList.add('d-none');
        container.innerHTML = '';

        orders.forEach(order => {
            const statusConfig = STATUS_MAP[order.status] || { text: order.status, class: 'bg-light text-dark' };
            const dateStr = order.createdAt ? new Date(order.createdAt).toLocaleString('vi-VN') : 'Mới đây';
            const total = Number(order.totalAmount || 0);

            const card = document.createElement('div');
            card.className = 'card order-card bg-white p-4 mb-3 shadow-sm';
            card.innerHTML = `
                <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 border-bottom gap-2">
                    <div>
                        <span class="fw-bold text-dark">Đơn hàng #${order.id}</span>
                        <small class="text-muted ms-2"><i class="fa-regular fa-clock me-1"></i>${dateStr}</small>
                    </div>
                    <span class="status-badge ${statusConfig.class}">
                        ${statusConfig.text}
                    </span>
                </div>
                <div class="py-3">
                    <div class="small text-muted mb-1">
                        <i class="fa-solid fa-location-dot me-1 text-danger"></i> <strong>Địa chỉ giao:</strong> ${order.shippingAddress || 'Chưa cung cấp'}
                    </div>
                    ${order.note ? `<div class="small text-muted mb-1"><i class="fa-regular fa-note-sticky me-1"></i> <strong>Ghi chú:</strong> ${order.note}</div>` : ''}
                    <div class="small text-muted">
                        <i class="fa-regular fa-credit-card me-1"></i> <strong>Phương thức:</strong> ${order.paymentMethod === 'BANKING' ? 'Cổng VNPAY' : 'COD (Tiền mặt)'}
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <span class="text-muted small">Tổng thanh toán:</span>
                    <span class="fw-bold text-danger fs-5">${total.toLocaleString('vi-VN')} đ</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    window.onload = loadOrders;
</script>
</body>
</html>
