<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt hàng thành công - CosmeticShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-color: #e85a71; }
        .btn-primary-custom { background-color: var(--primary-color); color: #fff; border: none; }
        .btn-primary-custom:hover { background-color: #d4435b; color: #fff; }
    </style>
</head>
<body class="bg-light">

<div class="container my-5 py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 mx-auto" style="max-width: 550px;">
        <div class="mb-3">
            <i class="fa-solid fa-circle-check text-success" style="font-size: 4rem;"></i>
        </div>
        <h3 class="fw-bold mb-2">Đặt hàng thành công!</h3>
        <p class="text-muted">Cảm ơn bạn đã lựa chọn mua sắm tại <strong>CosmeticShop</strong>. Hóa đơn chi tiết và email xác nhận đã được gửi về hòm thư của bạn.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a th:href="@{/}" class="btn btn-primary-custom rounded-pill px-4 py-2">
                <i class="fa-solid fa-arrow-left me-1"></i> Tiếp tục mua sắm
            </a>
        </div>
    </div>
</div>

</body>
</html>
