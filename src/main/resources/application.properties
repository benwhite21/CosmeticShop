spring.application.name=CosmeticShop

# Kết nối MySQL XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/sarah_cosmetics_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate tự động tạo bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Giới hạn kích thước file upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Đường dẫn thư mục lưu ảnh cục bộ trên máy chủ
app.upload.dir=uploads/